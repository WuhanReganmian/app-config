name: Build Custom sing-box & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '请输入发布版本号/Tag (例如: v1.14.0-test)'
        required: true
        default: 'v1.14.0-test'

permissions:
  contents: write

env:
  GO_VERSION: '1.26.x'
  GOTOOLCHAIN: 'local'
  # 统一为 Linux 编译所需的完整 Tags（包含 eBPF）
  BUILD_TAGS: "with_ebpf,with_quic,with_dhcp,with_wireguard,with_utls,with_reality,with_clash_api,with_grpc"

jobs:
  build-archlinux:
    name: Build Arch Linux aarch64 Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sing-box remote
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: testing
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Install CGO dependencies for eBPF
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Compile linux_aarch64 with eBPF
        run: |
          GOOS=linux GOARCH=arm64 CGO_ENABLED=1 CC=aarch64-linux-gnu-gcc \
            go build -v -trimpath -tags "${{ env.BUILD_TAGS }}" -o build/sing-box ./cmd/sing-box

      - name: Package into .pkg.tar.zst
        run: |
          RAW_VERSION="${{ inputs.version }}"
          export VERSION=$(echo "${RAW_VERSION}" | sed 's/^v//')
          
          cat << 'EOF' > nfpm.yaml
          name: "sing-box"
          arch: "aarch64"
          platform: "linux"
          version: "${VERSION}"
          release: "1"
          maintainer: "Custom Builder"
          description: "The universal proxy platform (with eBPF)"
          license: "GPL-3.0"
          contents:
            - src: "./build/sing-box"
              dst: "/usr/bin/sing-box"
              file_info:
                mode: 0755
          EOF
          
          ~/go/bin/nfpm pkg --packager archlinux --target sing-box-${VERSION}-1-aarch64.pkg.tar.zst

      - name: Upload Arch Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-linux-aarch64
          path: "*.pkg.tar.zst"
          retention-days: 1

  publish-release:
    name: Publish to GitHub Releases
    needs: [build-archlinux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: "sing-box ${{ inputs.version }}"
          body: |
            ### 编译说明
            - 核心分支：`SagerNet/sing-box@testing`
            - 特性支持：`${{ env.BUILD_TAGS }}`
            - 版本：`${{ inputs.version }}`
          prerelease: true
          files: |
            artifacts/**/*.pkg.tar.zst
