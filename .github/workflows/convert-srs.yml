name: Auto Convert Multiple SRS

on:
  schedule:
    # 每天北京时间早上 6 点执行
    - cron: '0 6 * * 0'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: pip install requests pyyaml

      - name: Fetch and Convert to JSON
        run: |
          python3 - <<'EOF'
          import requests
          import json
          import yaml
          import ipaddress

          # ================= 任务配置区 =================
          TASKS = [
              {
                  "name": "my_domains",
                  "url": "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/ChinaMax/ChinaMax_Domain.yaml",
                  "type": "domain_suffix"
              },
              {
                  "name": "my_ips",
                  "url": "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/refs/heads/master/rule/Clash/ChinaMax/ChinaMax_IP.yaml",
                  "type": "ip_cidr"
              }
          ]
          # ==============================================

          def clean_ip(item):
              item = item.strip()
              # 1. 尝试解析标准的 CIDR (如 1.1.1.1/32 或 10.0.0.0/8)
              try:
                  net = ipaddress.ip_network(item, strict=False)
                  return str(net)
              except ValueError:
                  pass
              
              # 2. 如果是没有掩码的单独 IP (如 1.1.1.1)，自动补全掩码 /32 或 /128
              try:
                  ip = ipaddress.ip_address(item)
                  if ip.version == 4:
                      return f"{ip}/32"
                  else:
                      return f"{ip}/128"
              except ValueError:
                  pass
              
              # 3. 无法解析的非法字符串 (如 132203) 返回 None 丢弃
              return None

          for task in TASKS:
              name = task["name"]
              url = task["url"]
              rule_type = task["type"]
              print(f"Processing {name} from {url}...")
              
              try:
                  response = requests.get(url, timeout=10)
                  response.raise_for_status()
                  content = response.text
              except Exception as e:
                  print(f"Failed to fetch {url}: {e}")
                  continue

              raw_items = []

              # 解析 YAML 或 TXT
              if 'payload:' in content or url.endswith(('.yaml', '.yml')):
                  try:
                      data = yaml.safe_load(content)
                      if 'payload' in data and data['payload']:
                          for rule in data['payload']:
                              if isinstance(rule, str):
                                  parts = rule.split(',')
                                  if len(parts) >= 2:
                                      raw_items.append(parts[1].strip())
                                  elif not rule.startswith('#') and ',' not in rule:
                                      raw_items.append(rule.lstrip('+.'))
                  except Exception as e:
                      print(f"Failed to parse YAML for {name}: {e}")
                      continue
              else:
                  for line in content.splitlines():
                      line = line.strip()
                      if line and not line.startswith('#'):
                          raw_items.append(line)

              # 验证并清洗数据
              valid_items = []
              for item in raw_items:
                  if rule_type == "ip_cidr":
                      validated = clean_ip(item)
                      if validated:
                          valid_items.append(validated)
                  else:
                      # 域名类型直接保留非空行
                      if item:
                          valid_items.append(item)

              singbox_rule = {
                  "version": 1,
                  "rules": [
                      {
                          rule_type: valid_items
                      }
                  ]
              }

              with open(f"{name}.json", 'w', encoding='utf-8') as f:
                  json.dump(singbox_rule, f, indent=2)
                  
              filtered_count = len(raw_items) - len(valid_items)
              print(f"Successfully converted {name}: {len(valid_items)} valid rules (filtered {filtered_count} invalid lines).")
          EOF

      - name: Download Sing-box
        run: |
          LATEST_TAG=$(curl -s https://api.github.com/repos/SagerNet/sing-box/releases/latest | grep tag_name | cut -d '"' -f 4)
          echo "Downloading Sing-box $LATEST_TAG..."
          wget -qO sing-box.tar.gz "https://github.com/SagerNet/sing-box/releases/download/${LATEST_TAG}/sing-box-${LATEST_TAG#v}-linux-amd64.tar.gz"
          tar -xzf sing-box.tar.gz
          
          # 将可执行文件直接移动到系统 PATH 目录，避免与当前目录下的文件夹冲突
          sudo mv sing-box-*/sing-box /usr/local/bin/sing-box
          sudo chmod +x /usr/local/bin/sing-box

      - name: Compile JSONs to SRS
        run: |
          for file in *.json; do
            if [ -f "$file" ]; then
              filename=$(basename -- "$file")
              name="${filename%.*}"
              echo "Compiling $name.srs..."
              
              # 直接使用全局命令 sing-box，无需加 ./
              sing-box rule-set compile "$file" -o "$name.srs"
            fi
          done

      - name: Commit and Push SRS
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update multiple SRS files"
          # 匹配所有编译好的 srs 文件并提交
          file_pattern: "*.srs"
